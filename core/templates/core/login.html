{% extends "core/base.html" %}
{% block content %}
<div class="card" style="max-width:380px;margin:60px auto">
  <h2>KINO CATÁLOGO CONTROL</h2>
  <form method="post">{% csrf_token %}
    <p><input name="username" placeholder="Usuario" autofocus style="width:100%"></p>
    <p><input name="password" type="password" placeholder="Contraseña" style="width:100%"></p>
    {% if form.errors %}<p class="msg error">Usuario o contraseña incorrectos.</p>{% endif %}
    <button>Entrar</button>
  </form>
</div>
{% endblock %}
